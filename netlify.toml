# Netlify settings, read automatically when the site is connected to this repo.
[build]
  command = "npm run build"
  publish = "dist"

# The companion's server step (holds the AI key): netlify/functions/chat.mts,
# answering at /api/chat. Add ANTHROPIC_API_KEY under Site configuration →
# Environment variables; without it the chat runs in demo mode.
[functions]
  directory = "netlify/functions"
